<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="全球国家概览：195 国的国旗、首都、所在洲、面积与人口速查，附面积、人口前十图表与军力、GDP 前十榜单。">
  <title>全球国家概览｜知行簿</title>
  <link rel="icon" href="assets/site-mark.svg">
  <link rel="stylesheet" href="assets/site-nav.css">
  <link rel="stylesheet" href="assets/general-knowledge.css">
  <link rel="stylesheet" href="assets/gk-countries.css">
  <script src="assets/site-nav.js" defer></script>
  <script src="assets/gk-countries.js" defer></script>
</head>
<body id="top" class="gk-page">
  <a class="skip-link" href="#main">跳到全球国家概览正文</a>
  <header class="site-header">
    <div class="site-inner">
      <div class="site-wordmark">知行簿</div>
      <nav class="site-links" data-site-nav aria-label="站点导航">
        <a href="ai.html">AI</a>
        <a href="market-memo.html">随笔</a>
        <a href="thoughts.html">思考</a>
        <a href="general-knowledge.html" aria-current="page">拾零</a>
        <a href="life.html">生活</a>
        <a href="ai-learning-index.html">收藏</a>
      </nav>
    </div>
  </header>

  <main class="gkc-main page-shell" id="main">
    <header class="gkc-hero">
      <div class="gkc-title">
        <h1>全球国家概览</h1>
      </div>
      <div class="gkc-toolbar">
        <label class="gkc-search">
          <span class="visually-hidden">搜索国家、首都或代码</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
          <input id="country-search" type="search" placeholder="搜索国家、首都或代码" autocomplete="off">
        </label>
        <nav class="gkc-filters" aria-label="按所在洲筛选">
          <button type="button" class="is-active" data-region="全部" aria-pressed="true">全部</button>
          <button type="button" data-region="亚洲" aria-pressed="false">亚洲</button>
          <button type="button" data-region="欧洲" aria-pressed="false">欧洲</button>
          <button type="button" data-region="非洲" aria-pressed="false">非洲</button>
          <button type="button" data-region="北美洲" aria-pressed="false">北美洲</button>
          <button type="button" data-region="南美洲" aria-pressed="false">南美洲</button>
          <button type="button" data-region="大洋洲" aria-pressed="false">大洋洲</button>
        </nav>
        <div class="gkc-stats" role="status" aria-live="polite" aria-atomic="true"><span id="country-count">显示 195 / 195 国</span><span id="population-sum"></span></div>
      </div>
    </header>

    <div class="gkc-layout">
      <section class="gkc-reference" aria-label="国家资料速查">
        <p class="gk-table-hint" id="country-table-hint" hidden>左右滑动查看，国家名称保持可见。</p>
        <div class="gkc-table-wrap" tabindex="0" role="region" aria-label="国家资料表格" aria-describedby="country-table-hint">
          <table class="gkc-table">
            <caption class="visually-hidden">全球 195 个国家的国旗、中英文名、代码、首都、所在洲、面积与人口。</caption>
            <colgroup>
              <col class="gkc-col-country">
              <col class="gkc-col-capital">
              <col class="gkc-col-region">
              <col>
              <col class="gkc-col-population">
            </colgroup>
            <thead>
              <tr>
                <th scope="col" data-sort="n" class="country-cell sortable"><button type="button">国家 <span class="gkc-sort-icon" aria-hidden="true">↕</span></button></th>
                <th scope="col">首都</th>
                <th scope="col">所在洲</th>
                <th scope="col" data-sort="a" class="sortable num"><button type="button">面积 <span class="gkc-sort-icon" aria-hidden="true">↕</span></button><span class="gkc-column-unit">km²</span></th>
                <th scope="col" data-sort="p" class="sortable num"><button type="button">人口 <span class="gkc-sort-icon" aria-hidden="true">↓</span></button><span class="gkc-column-unit">2024</span></th>
              </tr>
            </thead>
            <tbody id="country-rows"></tbody>
          </table>
        </div>
        <div class="gkc-empty" id="country-empty" hidden>
          <p>没有找到匹配的国家</p>
          <span>试试其他国家名、首都或代码，也可以清除当前筛选。</span>
          <button type="button" id="country-reset">清除筛选</button>
        </div>
      </section>

      <aside class="gkc-insights" aria-label="全球前十概览">
        <section class="gkc-charts" aria-label="面积与人口前十图表">
          <figure class="gkc-ranking gkc-chart gkc-chart-area" aria-labelledby="area-chart-title">
            <figcaption class="gkc-ranking-heading"><h2 id="area-chart-title">面积前十</h2><span class="gkc-ranking-year">总面积</span></figcaption>
            <p class="gkc-ranking-source">单位：万平方公里</p>
            <ol class="gkc-chart-list" id="area-top-ten" role="list"></ol>
            <div class="gkc-chart-axis" aria-hidden="true"><span>0</span><span id="area-chart-max"></span></div>
          </figure>
          <figure class="gkc-ranking gkc-chart gkc-chart-population" aria-labelledby="population-chart-title">
            <figcaption class="gkc-ranking-heading"><h2 id="population-chart-title">人口前十</h2><span class="gkc-ranking-year">2024 年</span></figcaption>
            <p class="gkc-ranking-source">单位：亿人 · 世界银行</p>
            <ol class="gkc-chart-list" id="population-top-ten" role="list"></ol>
            <div class="gkc-chart-axis" aria-hidden="true"><span>0</span><span id="population-chart-max"></span></div>
          </figure>
        </section>
        <section class="gkc-rankings" aria-label="全球军力与 GDP 前十国家">
          <article class="gkc-ranking" aria-labelledby="military-title">
            <header class="gkc-ranking-heading"><h2 id="military-title">军力前十</h2><span class="gkc-ranking-year">2026 年</span></header>
            <p class="gkc-ranking-source">Global Firepower · 指数越低，军力越强</p>
            <div class="gkc-ranking-labels" aria-hidden="true"><span>国家</span><span>军力指数</span></div>
            <ol class="gkc-ranking-list" id="military-top-ten" role="list"></ol>
          </article>
          <article class="gkc-ranking" aria-labelledby="gdp-title">
            <header class="gkc-ranking-heading"><h2 id="gdp-title">GDP 前十</h2><span class="gkc-ranking-year">2024 年</span></header>
            <p class="gkc-ranking-source">世界银行 · 现价美元</p>
            <div class="gkc-ranking-labels" aria-hidden="true"><span>国家</span><span>万亿美元</span></div>
            <ol class="gkc-ranking-list" id="gdp-top-ten" role="list"></ol>
          </article>
        </section>
      </aside>
    </div>

  </main>

  <a class="site-back-top" href="#top" aria-label="返回页面顶部">↑</a>
</body>
</html>
